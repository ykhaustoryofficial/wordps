<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#eef4f7" />
  <title>SimpleDoc - A4 문서 편집기</title>
  <style>
:root {
  --blue-deep: #315A73;
  --blue-dark: #426D86;
  --blue-main: #6696B1;
  --blue-mid: #91B7CA;
  --blue-soft: #DDECF3;
  --blue-pale: #F3F8FB;
  --ink: #34434D;
  --ink-strong: #273943;
  --text-sub: #607580;
  --text-muted: #87969E;
  --border: #D9E6EC;
  --border-strong: #C6D9E2;
  --page-bg: #EDF4F7;
  --white: #FFFFFF;
  --danger: #a95f5f;
  --radius-sm: 8px;
  --radius-md: 12px;
  --shadow: 0 14px 40px rgba(51, 86, 105, 0.10);
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  background: var(--page-bg);
  color: var(--ink);
}
button, input, select { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.app-header {
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  background: rgba(255,255,255,.95);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: blur(12px);
}
.brand-block { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 10px;
  display: grid; place-items: center;
  background: var(--blue-deep); color: #fff; font-weight: 900;
}
.brand-title { font-weight: 850; color: var(--blue-deep); line-height: 1.05; }
.brand-subtitle { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
.header-actions { display: flex; gap: 8px; align-items: center; }

.btn, .tool-btn, .chip {
  border: 1px solid var(--border-strong);
  background: #fff;
  color: var(--ink);
  border-radius: 8px;
  cursor: pointer;
  transition: .15s ease;
}
.btn { height: 36px; padding: 0 14px; font-weight: 700; }
.btn:hover, .tool-btn:hover, .chip:hover { border-color: var(--blue-mid); background: var(--blue-pale); }
.btn.primary { background: var(--blue-main); border-color: var(--blue-main); color: #fff; }
.btn.strong { background: var(--blue-deep); border-color: var(--blue-deep); color: #fff; }
.btn.ghost { background: #fff; }
.file-label { display: inline-flex; align-items: center; justify-content: center; }
.btn.compact { height: 32px; padding: 0 10px; font-size: 12px; }

.toolbar-wrap {
  position: sticky;
  top: 64px;
  z-index: 45;
  background: rgba(255,255,255,.96);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
}
.toolbar {
  min-height: 48px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 18px;
  overflow-x: auto;
}
.tool-group { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }
.tool-group.wide { gap: 4px; }
.tool-divider { width: 1px; height: 26px; background: var(--border); flex: 0 0 auto; }
.control { height: 32px; border: 1px solid var(--border-strong); border-radius: 7px; background: #fff; color: var(--ink); padding: 0 8px; }
.select { width: 150px; }
.size-select { width: 64px; }
.unit { font-size: 11px; color: var(--text-muted); }
.tool-btn { width: 32px; height: 32px; font-weight: 800; padding: 0; }
.tool-btn.italic { font-style: italic; font-family: Georgia, serif; }
.tool-btn.underline { text-decoration: underline; }
.tool-btn.align { font-size: 20px; line-height: 1; overflow: hidden; letter-spacing: -4px; text-align: left; padding-left: 5px; }
.tool-btn.center-icon { text-align: center; padding-left: 0; }
.tool-btn.right-icon { text-align: right; padding-right: 5px; padding-left: 0; }
.tool-btn.justify-icon { text-align: justify; padding: 0 4px; }
.tool-btn.active { background: var(--blue-soft); color: var(--blue-deep); border-color: var(--blue-mid); }
.color-tool { width: 34px; height: 32px; border: 1px solid var(--border-strong); border-radius: 7px; display: grid; place-items: center; position: relative; font-weight: 800; cursor: pointer; }
.color-tool input { position: absolute; left: 5px; right: 5px; bottom: 2px; height: 4px; width: 23px; padding: 0; border: 0; background: transparent; }

.template-bar { display: flex; align-items: center; gap: 7px; padding: 7px 18px 9px; border-top: 1px solid #edf2f4; overflow-x: auto; }
.template-label { color: var(--text-muted); font-size: 11px; font-weight: 800; margin-right: 3px; white-space: nowrap; }
.chip { height: 28px; padding: 0 10px; border-radius: 999px; font-size: 11px; font-weight: 750; white-space: nowrap; }
.template-spacer { flex: 1 1 auto; }
.chip.page-action { color: var(--blue-deep); }
.chip.page-action.danger { color: var(--danger); }

.workspace { display: flex; min-height: calc(100vh - 158px); }
.side-panel {
  width: 220px; padding: 20px 16px; background: rgba(255,255,255,.86); border-right: 1px solid var(--border); position: sticky; top: 158px; height: calc(100vh - 196px); overflow: auto;
}
.panel-title { font-size: 13px; font-weight: 850; color: var(--blue-deep); margin-bottom: 12px; }
.panel-title.small { margin-bottom: 8px; }
.field-label { font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 5px; }
.side-input { width: 100%; height: 34px; border: 1px solid var(--border-strong); border-radius: 7px; padding: 0 9px; color: var(--ink); background: #fff; }
.panel-divider { height: 1px; background: var(--border); margin: 18px 0; }
.page-list { display: grid; gap: 7px; }
.page-list-item { width: 100%; height: 36px; border: 1px solid var(--border); background: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; cursor: pointer; font-size: 12px; color: var(--text-sub); }
.page-list-item.active { border-color: var(--blue-main); background: var(--blue-pale); color: var(--blue-deep); font-weight: 800; }
.page-list-item .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue-mid); }
.panel-help { padding: 12px; background: var(--blue-pale); border: 1px solid var(--blue-soft); border-radius: 10px; font-size: 11px; color: var(--text-sub); line-height: 1.6; }
.panel-help strong { color: var(--blue-deep); }
.panel-help p { margin: 4px 0 0; }

.canvas-area { flex: 1; min-width: 0; padding: 34px 24px 80px; overflow: auto; }
.document-root { --zoom: .90; display: flex; flex-direction: column; align-items: center; gap: 28px; transform-origin: top center; }
.floating-add-page { display: block; margin: 24px auto 0; height: 38px; padding: 0 18px; border: 1px dashed var(--blue-mid); background: rgba(255,255,255,.8); color: var(--blue-deep); border-radius: 999px; cursor: pointer; font-weight: 750; }

.statusbar {
  height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; background: rgba(255,255,255,.96); border-top: 1px solid var(--border); position: fixed; bottom: 0; left: 0; right: 0; z-index: 60; font-size: 11px; color: var(--text-muted);
}
.status-actions { display: flex; align-items: center; gap: 18px; }
.zoom-label { display: flex; align-items: center; gap: 7px; }
.zoom-label input { width: 110px; }

.dialog { width: min(390px, calc(100% - 30px)); border: 1px solid var(--border-strong); border-radius: 14px; padding: 0; box-shadow: 0 18px 70px rgba(39,57,67,.18); }
.dialog::backdrop { background: rgba(26,42,51,.25); backdrop-filter: blur(2px); }
.dialog form { padding: 22px; }
.dialog-title { font-size: 17px; font-weight: 850; color: var(--blue-deep); margin-bottom: 16px; }
.dialog-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.dialog-grid label { display: grid; gap: 6px; font-size: 12px; color: var(--text-sub); }
.dialog-grid input { height: 36px; border: 1px solid var(--border-strong); border-radius: 8px; padding: 0 9px; }
.dialog-check { margin-top: 14px; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--text-sub); }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

@media (max-width: 900px) {
  .side-panel { display: none; }
  .canvas-area { padding: 22px 6px 78px; }
  .header-actions .btn.ghost:first-child { display: none; }
}

@media (max-width: 640px) {
  .app-header { padding: 0 10px; }
  .brand-subtitle { display: none; }
  .header-actions { gap: 5px; }
  .header-actions .btn { padding: 0 9px; height: 34px; font-size: 11px; }
  .toolbar { padding-left: 8px; padding-right: 8px; }
  .template-bar { padding-left: 8px; padding-right: 8px; }
  .statusbar { padding: 0 10px; }
  #saveStatus { display: none; }
}

/* v2 additions */
.btn.docx { background: #eef6f2; border-color: #b8d5c9; color: #426f62; }
.btn.docx:hover { background: #e3f1eb; border-color: #8db9aa; }
.btn:disabled { opacity: .6; cursor: wait; }
.paragraph-tools { gap: 8px; }
.mini-control-label { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--text-muted); white-space: nowrap; }
.mini-select { width: 64px; height: 30px; padding: 0 5px; font-size: 11px; }
.auto-page-toggle { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-size: 11px; color: var(--blue-deep); font-weight: 750; }
.auto-page-toggle input { accent-color: var(--blue-main); }
.context-bar {
  display: flex; align-items: center; gap: 7px; min-height: 38px; padding: 5px 18px 7px;
  border-top: 1px solid #edf2f4; background: #f8fbfc; overflow-x: auto;
}
.context-bar[hidden] { display: none !important; }
.context-title { font-size: 11px; font-weight: 850; color: var(--blue-deep); white-space: nowrap; }
.context-info { font-size: 10px; color: var(--text-muted); white-space: nowrap; }
.context-sep { width: 1px; height: 20px; background: var(--border); flex: 0 0 auto; }
.context-hint { margin-left: auto; font-size: 10px; color: var(--text-muted); white-space: nowrap; }
.chip.danger-soft { color: var(--danger); background: #fffafa; }
.chip.emphasis { color: #fff; background: var(--blue-main); border-color: var(--blue-main); }
.page-list-item small { margin-left: 4px; font-size: 9px; color: var(--text-muted); font-weight: 650; }

@media (max-width: 900px) {
  .context-hint { display: none; }
}

  </style>
  <style>
:root {
  --blue-deep: #315A73;
  --blue-dark: #426D86;
  --blue-main: #6696B1;
  --blue-mid: #91B7CA;
  --blue-soft: #DDECF3;
  --blue-pale: #F3F8FB;
  --green: #5F8F80;
  --green-bg: #EDF6F2;
  --amber: #A97B42;
  --amber-bg: #FBF5EA;
  --gray-badge: #75828A;
  --gray-badge-bg: #F1F3F4;
  --ink: #34434D;
  --ink-strong: #273943;
  --text-sub: #607580;
  --text-muted: #87969E;
  --border: #D9E6EC;
  --border-strong: #C6D9E2;
}

.a4-page {
  width: 210mm;
  height: 297mm;
  min-height: 297mm;
  background: #fff;
  box-shadow: 0 16px 45px rgba(51,86,105,.15);
  position: relative;
  overflow: hidden;
  flex: 0 0 auto;
  zoom: var(--zoom, .9);
}

.page-inner {
  position: absolute;
  inset: 14mm 15mm;
  overflow: hidden;
  outline: none;
  color: var(--ink);
  font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size: 11pt;
  line-height: 1.7;
  word-break: keep-all;
  overflow-wrap: break-word;
  caret-color: var(--blue-deep);
}
.page-inner:focus { outline: none; }
.a4-page.active { box-shadow: 0 0 0 2px rgba(102,150,177,.55), 0 16px 45px rgba(51,86,105,.15); }
.page-inner > *:first-child { margin-top: 0; }

.doc-header {
  padding-bottom: 8mm;
  margin-bottom: 8mm;
  border-bottom: 2px solid var(--blue-deep);
}
.doc-eyebrow {
  margin-bottom: 2.5mm;
  color: var(--blue-main);
  font-size: 9.75pt;
  font-weight: 800;
  letter-spacing: .08em;
}
.doc-title {
  margin: 0;
  color: var(--blue-deep);
  font-size: 27pt;
  font-weight: 850;
  line-height: 1.25;
  letter-spacing: -.045em;
}
.doc-title-sub {
  margin-top: 2.5mm;
  color: var(--text-sub);
  font-size: 12pt;
  font-weight: 600;
}

.intro {
  margin: 0 0 10mm;
  padding: 5mm 6mm;
  background: var(--blue-pale);
  border-left: 1.1mm solid var(--blue-main);
  border-radius: 0 3mm 3mm 0;
  color: var(--text-sub);
  font-size: 11.25pt;
  font-weight: 500;
  line-height: 1.85;
}

.doc-section { margin-top: 12mm; }
.doc-section-title {
  display: flex;
  align-items: center;
  gap: 2.5mm;
  margin: 0 0 4.5mm;
  color: var(--blue-deep);
  font-size: 16.5pt;
  font-weight: 800;
  line-height: 1.4;
  letter-spacing: -.03em;
}
.doc-section-no {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 8mm;
  height: 8mm;
  padding: 0 2mm;
  background: var(--blue-deep);
  color: #fff;
  border-radius: 2mm;
  font-size: 10.5pt;
  font-weight: 800;
}
.doc-subtitle {
  margin: 7mm 0 2.5mm;
  color: var(--blue-dark);
  font-size: 12.75pt;
  font-weight: 750;
  line-height: 1.45;
}
.doc-mini-title {
  margin: 4.5mm 0 2mm;
  color: var(--ink-strong);
  font-size: 11.25pt;
  font-weight: 750;
}
.doc-body {
  margin: 0 0 4mm;
  color: var(--ink);
  font-size: 11.25pt;
  font-weight: 400;
  line-height: 1.85;
}
.doc-note {
  margin: 3mm 0 0;
  padding-left: 5mm;
  position: relative;
  color: var(--text-sub);
  font-size: 9.75pt;
  line-height: 1.7;
}
.doc-note::before {
  content: "※";
  position: absolute;
  left: 0;
  color: var(--blue-main);
  font-weight: 800;
}
.doc-divider { height: 1px; margin: 8mm 0; background: var(--border); }

.editor-table-wrap {
  width: 100%;
  margin: 4mm 0 5mm;
  border: 1px solid var(--border-strong);
  border-radius: 3mm;
  overflow: hidden;
}
.editor-table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  table-layout: fixed;
}
.editor-table th,
.editor-table td {
  padding: 2.8mm 3mm;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
  font-size: 9.75pt;
  line-height: 1.55;
  text-align: left;
  min-height: 8mm;
}
.editor-table th:last-child,
.editor-table td:last-child { border-right: none; }
.editor-table tr:last-child td { border-bottom: none; }
.editor-table th {
  background: var(--blue-soft);
  color: var(--blue-deep);
  font-weight: 800;
  text-align: center;
}

.doc-checkbox {
  display: inline-flex;
  align-items: center;
  gap: 2mm;
  margin: 1mm 2mm 1mm 0;
  color: var(--ink);
}
.doc-checkbox input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 4.5mm;
  height: 4.5mm;
  margin: 0;
  border: 1.6px solid var(--blue-mid);
  border-radius: 1mm;
  background: #fff;
  cursor: pointer;
  position: relative;
  flex: 0 0 auto;
}
.doc-checkbox input[type="checkbox"]:checked {
  background: var(--blue-main);
  border-color: var(--blue-main);
}
.doc-checkbox input[type="checkbox"]:checked::after {
  content: "✓";
  color: white;
  position: absolute;
  left: 50%; top: 47%; transform: translate(-50%,-50%);
  font-size: 9pt; font-weight: 900;
}

.doc-textbox {
  margin: 4mm 0;
  padding: 4.5mm 5mm;
  min-height: 18mm;
  border: 1px solid var(--border);
  border-radius: 3mm;
  background: var(--blue-pale);
  color: var(--ink);
  line-height: 1.7;
}
.doc-textbox::before {
  content: "텍스트박스";
  display: block;
  margin-bottom: 1.5mm;
  color: var(--blue-deep);
  font-size: 9pt;
  font-weight: 800;
}

.doc-callout {
  margin: 4.5mm 0;
  padding: 4.5mm 5mm;
  border: 1px solid var(--blue-soft);
  border-radius: 3mm;
  background: var(--blue-pale);
  font-size: 10.5pt;
  line-height: 1.75;
}
.doc-callout-title {
  margin: 0 0 1.5mm;
  color: var(--blue-deep);
  font-weight: 800;
}

.doc-signature { margin-top: 13mm; text-align: center; }
.doc-signature-date { margin-bottom: 4mm; color: var(--text-sub); font-size: 10.5pt; }
.doc-signature-org { color: var(--blue-deep); font-size: 15pt; font-weight: 800; letter-spacing: -.02em; }
.doc-signature-stamp {
  display: inline-block;
  margin-top: 2mm;
  padding: 1mm 2.6mm;
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--text-muted);
  font-size: 8.25pt;
  font-weight: 700;
}

.editor-marker { outline: 1px dashed rgba(102,150,177,.4); outline-offset: 2px; }


/* v2: table selection, images, pagination */
.editor-table td.table-selected-cell,
.editor-table th.table-selected-cell {
  box-shadow: inset 0 0 0 2px rgba(102,150,177,.75);
  background-image: linear-gradient(rgba(221,236,243,.38), rgba(221,236,243,.38));
}

.doc-image-block {
  margin: 5mm 0;
  text-align: center;
  break-inside: avoid;
  page-break-inside: avoid;
}
.doc-image {
  display: inline-block;
  max-width: 100%;
  height: auto;
  border-radius: 3mm;
  box-shadow: 0 3px 14px rgba(51,86,105,.10);
  vertical-align: top;
  cursor: pointer;
}
.doc-image.selected {
  outline: 2px solid rgba(102,150,177,.75);
  outline-offset: 2px;
}

.a4-page.overflowing::after {
  content: "A4 영역 초과";
  position: absolute;
  right: 4mm;
  bottom: 3mm;
  z-index: 4;
  padding: 1mm 2mm;
  border-radius: 999px;
  background: #fff1f1;
  color: #a95f5f;
  border: 1px solid #e8c3c3;
  font-size: 8pt;
  font-weight: 700;
  pointer-events: none;
}
.doc-image { max-height: 245mm; object-fit: contain; }

  </style>

<body>
  <header class="app-header no-print">
    <div class="brand-block">
      <div class="brand-mark">S</div>
      <div>
        <div class="brand-title">SimpleDoc</div>
        <div class="brand-subtitle">A4 문서 편집기 · v2</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn ghost" id="newDocBtn" type="button">새 문서</button>
      <label class="btn ghost file-label" for="loadFileInput">불러오기</label>
      <input id="loadFileInput" type="file" accept=".ykdoc,.json,.html,.htm" hidden />
      <button class="btn primary" id="saveBtn" type="button">저장</button>
      <button class="btn docx" id="docxBtn" type="button">DOCX</button>
      <button class="btn strong" id="printBtn" type="button">PDF 출력</button>
    </div>
  </header>

  <div class="toolbar-wrap no-print">
    <div class="toolbar" aria-label="문서 편집 도구">
      <div class="tool-group wide">
        <select id="fontFamily" class="control select" title="글꼴">
          <option value="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">Pretendard</option>
          <option value="'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">Noto Sans KR</option>
          <option value="'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">Apple SD Gothic Neo</option>

  <script>
window.SimpleDoc = window.SimpleDoc || {};

SimpleDoc.state = {
  activePageId: null,
  savedRange: null,
  undoStack: [],
  redoStack: [],
  dirty: false,
  maxHistory: 60,
  historyLock: false,
  autoPaginate: true,
  selectedImage: null
};

SimpleDoc.uid = function(prefix = 'id') {
  return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
};

SimpleDoc.getPages = function() {
  return [...document.querySelectorAll('.a4-page')];
};

SimpleDoc.getActivePage = function() {
  return document.querySelector(`.a4-page[data-page-id="${SimpleDoc.state.activePageId}"]`) || SimpleDoc.getPages()[0];
};

SimpleDoc.getActiveEditor = function() {
  return SimpleDoc.getActivePage()?.querySelector('.page-inner') || null;
};

SimpleDoc.setActivePage = function(page) {
  if (!page) return;
  SimpleDoc.getPages().forEach(p => p.classList.toggle('active', p === page));
  SimpleDoc.state.activePageId = page.dataset.pageId;
  SimpleDoc.refreshPageList();
  SimpleDoc.updatePageStatus();
};

SimpleDoc.defaultPageHTML = function() {
  return `
    <header class="doc-header">
      <div class="doc-eyebrow">DOCUMENT</div>
      <h1 class="doc-title">문서 제목을 입력하세요</h1>
      <div class="doc-title-sub">문서 부제 또는 소속을 입력하세요</div>
    </header>
    <div class="intro">문서의 목적이나 핵심 내용을 간단히 입력하세요.</div>
    <section class="doc-section">
      <h2 class="doc-section-title"><span class="doc-section-no">1</span>첫 번째 섹션</h2>
      <p class="doc-body">내용을 입력하세요.</p>
    </section>
  `;
};

SimpleDoc.bindEditor = function(inner, page) {
  inner.addEventListener('focus', () => SimpleDoc.setActivePage(page));
  inner.addEventListener('pointerdown', () => SimpleDoc.setActivePage(page));
  inner.addEventListener('input', () => {
    SimpleDoc.markDirty();
    SimpleDoc.queueHistory();
    if (SimpleDoc.state.autoPaginate && SimpleDoc.Pagination) SimpleDoc.Pagination.queue(page);
    else SimpleDoc.warnOverflow(page);
  });
  inner.addEventListener('keyup', SimpleDoc.Selection.capture);
  inner.addEventListener('mouseup', SimpleDoc.Selection.capture);
  inner.addEventListener('touchend', SimpleDoc.Selection.capture);
};

SimpleDoc.createPage = function(html = '', focus = false, options = {}) {
  const page = document.createElement('article');
  page.className = 'a4-page';
  page.dataset.pageId = SimpleDoc.uid('page');
  page.dataset.autoPage = options.auto ? '1' : '0';

  const inner = document.createElement('div');
  inner.className = 'page-inner';
  inner.contentEditable = 'true';
  inner.spellcheck = true;
  inner.innerHTML = html || '<p class="doc-body"><br></p>';

  page.appendChild(inner);
  const root = document.getElementById('documentRoot');
  if (options.after?.parentNode === root) options.after.insertAdjacentElement('afterend', page);
  else root.appendChild(page);

  SimpleDoc.bindEditor(inner, page);

  const activeStillExists = document.querySelector(`.a4-page[data-page-id="${SimpleDoc.state.activePageId}"]`);
  if (focus || SimpleDoc.getPages().length === 1 || !activeStillExists) SimpleDoc.setActivePage(page);
  else {
    SimpleDoc.refreshPageList();
    SimpleDoc.updatePageStatus();
  }

  if (focus) {
    inner.focus();
    SimpleDoc.placeCaretAtEnd(inner);
  }
  return page;
};

SimpleDoc.deleteActivePage = function() {
  const pages = SimpleDoc.getPages();
  if (pages.length <= 1) {
    alert('문서에는 최소 1개의 페이지가 필요합니다.');
    return;
  }
  const active = SimpleDoc.getActivePage();
  const idx = pages.indexOf(active);
  active.remove();
  const remain = SimpleDoc.getPages();
  SimpleDoc.setActivePage(remain[Math.max(0, idx - 1)] || remain[0]);
  SimpleDoc.markDirty();
  SimpleDoc.snapshot();
};

SimpleDoc.placeCaretAtEnd = function(el) {
  const range = document.createRange();
  range.selectNodeContents(el);
  range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  SimpleDoc.state.savedRange = range.cloneRange();
};

SimpleDoc.refreshPageList = function() {
  const list = document.getElementById('pageList');
  if (!list) return;
  list.innerHTML = '';
  SimpleDoc.getPages().forEach((page, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'page-list-item' + (page.dataset.pageId === SimpleDoc.state.activePageId ? ' active' : '');
    const auto = page.dataset.autoPage === '1' ? '<small>자동</small>' : '';
    btn.innerHTML = `<span>페이지 ${i + 1} ${auto}</span><span class="dot"></span>`;
    btn.addEventListener('click', () => {
      SimpleDoc.setActivePage(page);
      page.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    list.appendChild(btn);
  });
};

SimpleDoc.updatePageStatus = function() {
  const pages = SimpleDoc.getPages();
  const active = SimpleDoc.getActivePage();
  const current = Math.max(1, pages.indexOf(active) + 1);
  const el = document.getElementById('pageStatus');
  if (el) el.textContent = `${current} / ${pages.length} 페이지`;
};

SimpleDoc.markDirty = function() {
  SimpleDoc.state.dirty = true;
  const el = document.getElementById('saveStatus');
  if (el) el.textContent = '수정됨';
};

SimpleDoc.markSaved = function() {
  SimpleDoc.state.dirty = false;
  const el = document.getElementById('saveStatus');
  if (el) el.textContent = '저장됨';
};

SimpleDoc.warnOverflow = function(page) {
  if (!page?.isConnected) return false;
  const inner = page.querySelector('.page-inner');
  const overflow = inner.scrollHeight > inner.clientHeight + 2;
  page.classList.toggle('overflowing', overflow);
  page.title = overflow ? '이 페이지의 내용이 A4 인쇄 영역을 초과했습니다.' : '';
  return overflow;
};

SimpleDoc.insertHTML = function(html) {
  const editor = SimpleDoc.getActiveEditor();
  if (!editor) return;
  editor.focus();
  const range = SimpleDoc.Selection.restoreOrCreate();
  if (!range) return;
  range.deleteContents();
  const fragment = range.createContextualFragment(html);
  const nodes = [...fragment.childNodes];
  range.insertNode(fragment);
  const last = nodes[nodes.length - 1];
  if (last) {
    range.setStartAfter(last);
    range.collapse(true);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    SimpleDoc.state.savedRange = range.cloneRange();
  }
  SimpleDoc.markDirty();
  SimpleDoc.snapshot();
  if (SimpleDoc.state.autoPaginate && SimpleDoc.Pagination) SimpleDoc.Pagination.queue(SimpleDoc.getActivePage(), 20);
};

SimpleDoc.insertBlock = function(type) {
  const blocks = {
    title: `<header class="doc-header"><div class="doc-eyebrow">DOCUMENT</div><h1 class="doc-title">문서 제목</h1><div class="doc-title-sub">문서 부제 또는 소속</div></header><p class="doc-body"><br></p>`,
    intro: `<div class="intro">문서의 목적이나 핵심 내용을 입력하세요.</div><p class="doc-body"><br></p>`,
    section: `<section class="doc-section"><h2 class="doc-section-title"><span class="doc-section-no">1</span>섹션 제목</h2><p class="doc-body">내용을 입력하세요.</p></section><p class="doc-body"><br></p>`,
    subtitle: `<h3 class="doc-subtitle">중제목을 입력하세요</h3><p class="doc-body"><br></p>`,
    note: `<p class="doc-note">참고사항 또는 각주를 입력하세요.</p><p class="doc-body"><br></p>`,
    callout: `<div class="doc-callout"><div class="doc-callout-title">안내</div>강조할 안내 내용을 입력하세요.</div><p class="doc-body"><br></p>`,
    signature: `<div class="doc-signature"><div class="doc-signature-date">2026년 00월 00일</div><div class="doc-signature-org">발행 기관명</div><div class="doc-signature-stamp">[직인 생략]</div></div><p class="doc-body"><br></p>`
  };
  if (blocks[type]) SimpleDoc.insertHTML(blocks[type]);
};

SimpleDoc.queueHistoryTimer = null;
SimpleDoc.queueHistory = function() {
  clearTimeout(SimpleDoc.queueHistoryTimer);
  SimpleDoc.queueHistoryTimer = setTimeout(SimpleDoc.snapshot, 350);
};

SimpleDoc.serializeContent = function() {
  return SimpleDoc.getPages().map(page => ({
    html: page.querySelector('.page-inner').innerHTML,
    auto: page.dataset.autoPage === '1'
  }));
};

SimpleDoc.snapshot = function() {
  if (SimpleDoc.state.historyLock) return;
  const current = JSON.stringify(SimpleDoc.serializeContent());
  const stack = SimpleDoc.state.undoStack;
  if (stack[stack.length - 1] === current) return;
  stack.push(current);
  if (stack.length > SimpleDoc.state.maxHistory) stack.shift();
  SimpleDoc.state.redoStack = [];
};

SimpleDoc.restoreSnapshot = function(serialized) {
  SimpleDoc.state.historyLock = true;
  const pagesData = JSON.parse(serialized);
  const root = document.getElementById('documentRoot');
  root.innerHTML = '';
  pagesData.forEach(item => {
    const data = typeof item === 'string' ? { html: item, auto: false } : item;
    SimpleDoc.createPage(data.html, false, { auto: !!data.auto });
  });
  SimpleDoc.setActivePage(SimpleDoc.getPages()[0]);
  SimpleDoc.state.historyLock = false;
  SimpleDoc.markDirty();
};

SimpleDoc.undo = function() {
  const stack = SimpleDoc.state.undoStack;
  if (stack.length <= 1) return;
  const current = stack.pop();
  SimpleDoc.state.redoStack.push(current);
  SimpleDoc.restoreSnapshot(stack[stack.length - 1]);
};

SimpleDoc.redo = function() {
  if (!SimpleDoc.state.redoStack.length) return;
  const next = SimpleDoc.state.redoStack.pop();
  SimpleDoc.state.undoStack.push(next);
  SimpleDoc.restoreSnapshot(next);
};

  </script>
  <script>
window.SimpleDoc = window.SimpleDoc || {};
SimpleDoc.Selection = {};

SimpleDoc.Selection.capture = function() {
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  const editor = SimpleDoc.getActiveEditor();
  if (editor && editor.contains(range.commonAncestorContainer)) {
    SimpleDoc.state.savedRange = range.cloneRange();
  }
};

SimpleDoc.Selection.restoreOrCreate = function() {
  const editor = SimpleDoc.getActiveEditor();
  if (!editor) return null;
  let range = SimpleDoc.state.savedRange;
  if (range && editor.contains(range.commonAncestorContainer)) {
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    return range;
  }
  range = document.createRange();
  range.selectNodeContents(editor);
  range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  SimpleDoc.state.savedRange = range.cloneRange();
  return range;
};

SimpleDoc.Selection.closestBlock = function(node) {
  if (!node) return null;
  let el = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
  const editor = SimpleDoc.getActiveEditor();
  const blockTags = new Set(['P','DIV','H1','H2','H3','H4','LI','TD','TH','SECTION','HEADER','FIGURE']);
  while (el && el !== editor) {
    if (blockTags.has(el.tagName)) return el;
    el = el.parentElement;
  }
  return editor;
};

SimpleDoc.Selection.blocksInRange = function(range) {
  const editor = SimpleDoc.getActiveEditor();
  if (!editor || !range) return [];
  if (range.collapsed) {
    const block = SimpleDoc.Selection.closestBlock(range.startContainer);
    return block && block !== editor ? [block] : [];
  }
  const selector = 'p,h1,h2,h3,h4,li,td,th,.doc-textbox,.doc-callout,.intro';
  return [...editor.querySelectorAll(selector)].filter(el => {
    try { return range.intersectsNode(el); } catch { return false; }
  });
};

SimpleDoc.Selection.wrapSelection = function(styleObj = {}) {
  const editor = SimpleDoc.getActiveEditor();
  if (!editor) return;
  editor.focus();
  const range = SimpleDoc.Selection.restoreOrCreate();
  if (!range) return;

  if (range.collapsed) {
    const span = document.createElement('span');
    Object.assign(span.style, styleObj);
    span.appendChild(document.createTextNode('\u200B'));
    range.insertNode(span);
    range.setStart(span.firstChild, 1);
    range.collapse(true);
  } else {
    const span = document.createElement('span');
    Object.assign(span.style, styleObj);
    try {
      range.surroundContents(span);
    } catch (e) {
      const frag = range.extractContents();
      span.appendChild(frag);
      range.insertNode(span);
    }
    range.selectNodeContents(span);
    range.collapse(false);
  }
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  SimpleDoc.state.savedRange = range.cloneRange();
  SimpleDoc.markDirty();
  SimpleDoc.snapshot();
};

SimpleDoc.Selection.toggleStyle = function(property, onValue, offValue = 'normal') {
  const range = SimpleDoc.Selection.restoreOrCreate();
  if (!range) return;
  const startEl = range.startContainer.nodeType === Node.ELEMENT_NODE ? range.startContainer : range.startContainer.parentElement;
  const current = startEl ? getComputedStyle(startEl)[property] : '';
  let isOn = false;
  if (property === 'fontWeight') isOn = Number(current) >= 600 || current === 'bold';
  else if (property === 'fontStyle') isOn = current === 'italic';
  else if (property === 'textDecorationLine') isOn = current.includes('underline');
  SimpleDoc.Selection.wrapSelection({ [property]: isOn ? offValue : onValue });
};

SimpleDoc.Selection.applyBlockStyles = function(styleObj) {
  const range = SimpleDoc.Selection.restoreOrCreate();
  if (!range) return;
  const blocks = SimpleDoc.Selection.blocksInRange(range);
  if (!blocks.length) return;
  blocks.forEach(block => Object.assign(block.style, styleObj));
  SimpleDoc.markDirty();
  SimpleDoc.snapshot();
  if (SimpleDoc.state.autoPaginate && SimpleDoc.Pagination) SimpleDoc.Pagination.queue(SimpleDoc.getActivePage(), 20);
};

SimpleDoc.Selection.align = function(value) {
  SimpleDoc.Selection.applyBlockStyles({ textAlign: value });
};

  </script>
  <script>
window.SimpleDoc = window.SimpleDoc || {};
SimpleDoc.Table = {
  anchor: null,
  focus: null,
  selected: []
};

SimpleDoc.Table.build = function(rows, cols, header) {
  let html = '<div class="editor-table-wrap"><table class="editor-table">';
  for (let r = 0; r < rows; r++) {
    html += '<tr>';
    for (let c = 0; c < cols; c++) {
      const tag = header && r === 0 ? 'th' : 'td';
      html += `<${tag}>${header && r === 0 ? `제목 ${c + 1}` : '&nbsp;'}</${tag}>`;
    }
    html += '</tr>';
  }
  html += '</table></div><p class="doc-body"><br></p>';
  return html;
};

SimpleDoc.Table.grid = function(table) {
  const grid = [];
  const rows = [...table.rows];
  rows.forEach((row, r) => {
    grid[r] ||= [];
    let c = 0;
    [...row.cells].forEach(cell => {
      while (grid[r][c]) c++;
      const rs = Math.max(1, cell.rowSpan || 1);
      const cs = Math.max(1, cell.colSpan || 1);
      const entry = { cell, row: r, col: c, rowSpan: rs, colSpan: cs };
      for (let rr = r; rr < r + rs; rr++) {
        grid[rr] ||= [];
        for (let cc = c; cc < c + cs; cc++) grid[rr][cc] = entry;
      }
      c += cs;
    });
  });
  return grid;
};

SimpleDoc.Table.info = function(cell) {
  const table = cell?.closest('table.editor-table');
  if (!table) return null;
  const grid = SimpleDoc.Table.grid(table);
  for (let r = 0; r < grid.length; r++) {
    for (let c = 0; c < (grid[r]?.length || 0); c++) {
      const e = grid[r][c];
      if (e?.cell === cell && e.row === r && e.col === c) return { table, grid, ...e };
    }
  }
  return null;
};

SimpleDoc.Table.clearSelection = function() {
  document.querySelectorAll('.table-selected-cell').forEach(cell => cell.classList.remove('table-selected-cell'));
  SimpleDoc.Table.selected = [];
};

SimpleDoc.Table.select = function(cell, extend = false) {
  const table = cell.closest('table.editor-table');
  if (!table) return;
  if (!extend || !SimpleDoc.Table.anchor || SimpleDoc.Table.anchor.closest('table') !== table) {
    SimpleDoc.Table.anchor = cell;
    SimpleDoc.Table.focus = cell;
  } else {
    SimpleDoc.Table.focus = cell;
  }
  SimpleDoc.Table.paintSelection();
  SimpleDoc.Table.updateTools();
};

SimpleDoc.Table.paintSelection = function() {
  SimpleDoc.Table.clearSelection();
  const a = SimpleDoc.Table.info(SimpleDoc.Table.anchor);
  const b = SimpleDoc.Table.info(SimpleDoc.Table.focus);
  if (!a || !b || a.table !== b.table) return;
  const r1 = Math.min(a.row, b.row);
  const r2 = Math.max(a.row + a.rowSpan - 1, b.row + b.rowSpan - 1);
  const c1 = Math.min(a.col, b.col);
  const c2 = Math.max(a.col + a.colSpan - 1, b.col + b.colSpan - 1);
  const unique = new Set();
  for (let r = r1; r <= r2; r++) {
    for (let c = c1; c <= c2; c++) {
      const e = a.grid[r]?.[c];
      if (e?.cell) unique.add(e.cell);
    }
  }
  SimpleDoc.Table.selected = [...unique];
  SimpleDoc.Table.selected.forEach(cell => cell.classList.add('table-selected-cell'));
};

SimpleDoc.Table.updateTools = function() {
  const bar = document.getElementById('tableTools');
  if (!bar) return;
  bar.hidden = !SimpleDoc.Table.anchor?.isConnected;
  if (!bar.hidden) {
    const count = document.getElementById('tableSelectionCount');
    if (count) count.textContent = `${SimpleDoc.Table.selected.length || 1}셀 선택`;
  }
};

SimpleDoc.Table.currentInfo = function() {
  return SimpleDoc.Table.info(SimpleDoc.Table.anchor);
};

SimpleDoc.Table.insertCellAt = function(row, targetCol, tag, oldGrid, oldRowIndex) {
  const newCell = document.createElement(tag || 'td');
  newCell.innerHTML = '&nbsp;';
  const cells = [...row.cells];
  let before = null;
  for (const cell of cells) {
    let anchorCol = Infinity;
    const gridRow = oldGrid[oldRowIndex] || [];
    for (let c = 0; c < gridRow.length; c++) {
      const e = gridRow[c];
      if (e?.cell === cell && e.col === c) { anchorCol = c; break; }
    }
    if (anchorCol >= targetCol) { before = cell; break; }
  }
  if (before) row.insertBefore(newCell, before);
  else row.appendChild(newCell);
  return newCell;
};

SimpleDoc.Table.addRow = function(where = 'below') {
  const info = SimpleDoc.Table.currentInfo();
  if (!info) return;
  const { table, grid } = info;
  const rows = [...table.rows];
  const insertIndex = where === 'above' ? info.row : info.row + info.rowSpan;
  const cols = Math.max(...grid.map(r => r?.length || 0));
  const tr = document.createElement('tr');
  const reference = rows[insertIndex] || null;
  const useHeader = insertIndex === 0 && rows[0] && [...rows[0].cells].every(c => c.tagName === 'TH');

  for (let c = 0; c < cols; c++) {
    const above = insertIndex > 0 ? grid[insertIndex - 1]?.[c] : null;
    if (above && above.row < insertIndex && above.row + above.rowSpan > insertIndex) {
      if (c === above.col) above.cell.rowSpan = above.rowSpan + 1;
      continue;
    }
    const cell = document.createElement(useHeader ? 'th' : 'td');
    cell.innerHTML = '&nbsp;';
    tr.appendChild(cell);
  }
  table.tBodies[0] ? table.tBodies[0].insertBefore(tr, reference) : table.insertBefore(tr, reference);
  SimpleDoc.Table.select(tr.cells[0] || info.cell);
  SimpleDoc.Table.changed();
};

SimpleDoc.Table.deleteRow = function() {
  const info = SimpleDoc.Table.currentInfo();
  if (!info) return;
  const { table, grid, row } = info;
  const rows = [...table.rows];
  if (rows.length <= 1) { alert('표에는 최소 1개의 행이 필요합니다.'); return; }
  const targetRow = rows[row];
  const entries = new Set((grid[row] || []).filter(Boolean));
  entries.forEach(e => {
    if (e.row < row) {
      e.cell.rowSpan = Math.max(1, e.rowSpan - 1);
    } else if (e.row === row && e.rowSpan > 1) {
      const nextRow = rows[row + 1];
      if (nextRow) {
        e.cell.rowSpan = e.rowSpan - 1;
        const before = [...nextRow.cells].find(cell => {
          const i = SimpleDoc.Table.info(cell);
          return i && i.col > e.col;
        });
        nextRow.insertBefore(e.cell, before || null);
      }
    }
  });
  targetRow.remove();
  const remain = table.rows[Math.min(row, table.rows.length - 1)];
  SimpleDoc.Table.select(remain?.cells[0] || table.rows[0]?.cells[0]);
  SimpleDoc.Table.changed();
};

SimpleDoc.Table.addColumn = function(where = 'right') {
  const info = SimpleDoc.Table.currentInfo();
  if (!info) return;
  const { table, grid } = info;
  const insertCol = where === 'left' ? info.col : info.col + info.colSpan;
  const expanded = new Set();
  [...table.rows].forEach((row, r) => {
    const left = insertCol > 0 ? grid[r]?.[insertCol - 1] : null;
    if (left && left.col < insertCol && left.col + left.colSpan > insertCol) {
      if (!expanded.has(left.cell)) {
        left.cell.colSpan = left.colSpan + 1;
        expanded.add(left.cell);
      }
      return;
    }
    const tag = row.cells[0]?.tagName?.toLowerCase() || 'td';
    SimpleDoc.Table.insertCellAt(row, insertCol, tag, grid, r);
  });
  const newGrid = SimpleDoc.Table.grid(table);
  SimpleDoc.Table.select(newGrid[info.row]?.[insertCol]?.cell || info.cell);
  SimpleDoc.Table.changed();
};

SimpleDoc.Table.deleteColumn = function() {
  const info = SimpleDoc.Table.currentInfo();
  if (!info) return;
  const { table, grid, col } = info;
  const cols = Math.max(...grid.map(r => r?.length || 0));
  if (cols <= 1) { alert('표에는 최소 1개의 열이 필요합니다.'); return; }
  const entries = new Set(grid.map(r => r?.[col]).filter(Boolean));
  entries.forEach(e => {
    if (e.colSpan > 1) e.cell.colSpan = e.colSpan - 1;
    else e.cell.remove();
  });
  const newGrid = SimpleDoc.Table.grid(table);
  const next = newGrid[Math.min(info.row, newGrid.length - 1)]?.[Math.min(col, cols - 2)]?.cell;
  SimpleDoc.Table.select(next || table.rows[0]?.cells[0]);
  SimpleDoc.Table.changed();
};

SimpleDoc.Table.mergeSelected = function() {
  const a = SimpleDoc.Table.info(SimpleDoc.Table.anchor);
  const b = SimpleDoc.Table.info(SimpleDoc.Table.focus);
  if (!a || !b || a.table !== b.table) return;
  const r1 = Math.min(a.row, b.row);
  const r2 = Math.max(a.row + a.rowSpan - 1, b.row + b.rowSpan - 1);
  const c1 = Math.min(a.col, b.col);
  const c2 = Math.max(a.col + a.colSpan - 1, b.col + b.colSpan - 1);
  if (r1 === r2 && c1 === c2) return;

  const unique = new Set();
  for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) {
    const e = a.grid[r]?.[c];
    if (!e) continue;
    const er2 = e.row + e.rowSpan - 1;
    const ec2 = e.col + e.colSpan - 1;
    if (e.row < r1 || er2 > r2 || e.col < c1 || ec2 > c2) {
      alert('이미 병합된 셀이 선택 영역 밖까지 걸쳐 있습니다. 먼저 해당 셀을 나눈 뒤 다시 시도하세요.');
      return;
    }
    unique.add(e);
  }
  const top = a.grid[r1]?.[c1];
  if (!top) return;
  const contents = [...unique]
    .sort((x, y) => x.row - y.row || x.col - y.col)
    .map(e => e.cell.innerHTML.trim())
    .filter(v => v && v !== '&nbsp;');
  top.cell.rowSpan = r2 - r1 + 1;
  top.cell.colSpan = c2 - c1 + 1;
  top.cell.innerHTML = contents.length ? contents.join('<br>') : '&nbsp;';
  unique.forEach(e => { if (e.cell !== top.cell) e.cell.remove(); });
  SimpleDoc.Table.anchor = top.cell;
  SimpleDoc.Table.focus = top.cell;
  SimpleDoc.Table.paintSelection();
  SimpleDoc.Table.changed();
};

SimpleDoc.Table.splitCell = function() {
  const info = SimpleDoc.Table.currentInfo();
  if (!info) return;
  const { table, grid, cell, row, col, rowSpan, colSpan } = info;
  if (rowSpan === 1 && colSpan === 1) return;
  const tag = cell.tagName.toLowerCase();
  cell.rowSpan = 1;
  cell.colSpan = 1;
  for (let r = row; r < row + rowSpan; r++) {
    const tr = table.rows[r];
    if (!tr) continue;
    for (let c = col; c < col + colSpan; c++) {
      if (r === row && c === col) continue;
      SimpleDoc.Table.insertCellAt(tr, c, tag, grid, r);
    }
  }
  SimpleDoc.Table.select(cell);
  SimpleDoc.Table.changed();
};

SimpleDoc.Table.changed = function() {
  SimpleDoc.markDirty();
  SimpleDoc.snapshot();
  SimpleDoc.Table.updateTools();
  if (SimpleDoc.state.autoPaginate && SimpleDoc.Pagination) SimpleDoc.Pagination.queue(SimpleDoc.getActivePage(), 20);
};

SimpleDoc.Table.bind = function() {
  document.addEventListener('pointerdown', e => {
    const cell = e.target.closest('table.editor-table td, table.editor-table th');
    if (cell) {
      SimpleDoc.Table.select(cell, e.shiftKey);
      return;
    }
    if (!e.target.closest('#tableTools')) {
      SimpleDoc.Table.clearSelection();
      SimpleDoc.Table.anchor = null;
      SimpleDoc.Table.focus = null;
      SimpleDoc.Table.updateTools();
    }
  });
};

  <script>
window.SimpleDoc = window.SimpleDoc || {};
SimpleDoc.Pagination = {
  timer: null,
  lock: false
};

SimpleDoc.Pagination.isOverflow = function(page) {
  const inner = page?.querySelector('.page-inner');
  return !!inner && inner.scrollHeight > inner.clientHeight + 2;
};

SimpleDoc.Pagination.isEmpty = function(inner) {
  if (!inner) return true;
  if (inner.querySelector('img,table,input,hr,.doc-textbox,.doc-callout')) return false;
  return !inner.textContent.replace(/\u200B/g, '').trim();
};

SimpleDoc.Pagination.nextPage = function(page) {
  const pages = SimpleDoc.getPages();
  const i = pages.indexOf(page);
  return i >= 0 ? pages[i + 1] || null : null;
};

SimpleDoc.Pagination.ensureNextPage = function(page) {
  let next = SimpleDoc.Pagination.nextPage(page);
  if (next) return next;
  next = SimpleDoc.createPage('<p class="doc-body auto-placeholder"><br></p>', false, { auto: true, after: page });
  return next;
};

SimpleDoc.Pagination.clearPlaceholder = function(inner) {
  if (inner.children.length === 1 && inner.firstElementChild?.classList.contains('auto-placeholder')) inner.innerHTML = '';
};

SimpleDoc.Pagination.prependNode = function(inner, node) {
  SimpleDoc.Pagination.clearPlaceholder(inner);
  inner.insertBefore(node, inner.firstChild);
};

SimpleDoc.Pagination.pointAtTextOffset = function(root, offset) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let node;
  let remain = Math.max(0, offset);
  let last = null;
  while ((node = walker.nextNode())) {
    last = node;
    if (remain <= node.nodeValue.length) return { node, offset: remain };
    remain -= node.nodeValue.length;
  }
  if (last) return { node: last, offset: last.nodeValue.length };
  return { node: root, offset: root.childNodes.length };
};

SimpleDoc.Pagination.fragmentForTextRange = function(block, start, end) {
  const r = document.createRange();
  const a = SimpleDoc.Pagination.pointAtTextOffset(block, start);
  const b = SimpleDoc.Pagination.pointAtTextOffset(block, end);
  r.setStart(a.node, a.offset);
  r.setEnd(b.node, b.offset);
  return r.cloneContents();
};

SimpleDoc.Pagination.makeTextClone = function(block, start, end) {
  const clone = block.cloneNode(false);
  clone.appendChild(SimpleDoc.Pagination.fragmentForTextRange(block, start, end));
  if (!clone.textContent && !clone.children.length) clone.innerHTML = '<br>';
  return clone;
};

SimpleDoc.Pagination.splitTextBlock = function(page, block, nextInner) {
  if (!block.matches('p') || block.closest('td,th')) return false;
  const textLen = block.textContent.length;
  if (textLen < 2) return false;
  const inner = page.querySelector('.page-inner');
  const parent = block.parentNode;
  const nextSibling = block.nextSibling;
  let low = 1, high = textLen - 1, best = 0;

  while (low <= high) {
    const mid = Math.floor((low + high) / 2);
    const candidate = SimpleDoc.Pagination.makeTextClone(block, 0, mid);
    parent.replaceChild(candidate, block);
    const fits = inner.scrollHeight <= inner.clientHeight + 2;
    parent.replaceChild(block, candidate);
    if (fits) { best = mid; low = mid + 1; }
    else high = mid - 1;
  }

  if (best <= 0 || best >= textLen) return false;
  let split = best;
  const full = block.textContent;
  const prevSpace = full.lastIndexOf(' ', best);
  if (prevSpace > Math.max(1, best - 24)) split = prevSpace + 1;

  const first = SimpleDoc.Pagination.makeTextClone(block, 0, split);
  const second = SimpleDoc.Pagination.makeTextClone(block, split, textLen);
  parent.replaceChild(first, block);
  if (nextSibling && first.nextSibling !== nextSibling) parent.insertBefore(first, nextSibling);
  SimpleDoc.Pagination.prependNode(nextInner, second);
  return true;
};

SimpleDoc.Pagination.splitSection = function(page, section, nextInner) {
  if (!section.matches('.doc-section') || section.children.length < 2) return false;
  const inner = page.querySelector('.page-inner');
  const clone = section.cloneNode(false);
  const moved = [];
  let changed = false;
  while (SimpleDoc.Pagination.isOverflow(page) && section.children.length > 1) {
    const node = section.lastElementChild;
    moved.unshift(node);
    node.remove();
    changed = true;
  }
  if (!changed) return false;
  moved.forEach(node => clone.appendChild(node));
  if (SimpleDoc.Pagination.isOverflow(page) && section.children.length === 1) {
    moved.forEach(node => section.appendChild(node));
    return false;
  }
  SimpleDoc.Pagination.prependNode(nextInner, clone);
  return inner.scrollHeight <= inner.clientHeight + 2;
};

SimpleDoc.Pagination.splitTable = function(page, wrap, nextInner) {
  const table = wrap.querySelector(':scope > table.editor-table');
  if (!table || table.rows.length < 2) return false;
  if (table.querySelector('[rowspan]:not([rowspan="1"])')) return false;
  const header = [...table.rows[0].cells].every(c => c.tagName === 'TH') ? table.rows[0] : null;
  const minimum = header ? 2 : 1;
  if (table.rows.length <= minimum) return false;

  const cloneWrap = wrap.cloneNode(false);
  const cloneTable = table.cloneNode(false);
  const cloneBody = document.createElement('tbody');
  cloneTable.appendChild(cloneBody);
  cloneWrap.appendChild(cloneTable);
  if (header) cloneBody.appendChild(header.cloneNode(true));
  const moved = [];

  while (SimpleDoc.Pagination.isOverflow(page) && table.rows.length > minimum) {
    const row = table.rows[table.rows.length - 1];
    moved.unshift(row);
    row.remove();
  }
  if (!moved.length) return false;
  moved.forEach(row => cloneBody.appendChild(row));
  SimpleDoc.Pagination.prependNode(nextInner, cloneWrap);
  return true;
};

SimpleDoc.Pagination.flowOverflow = function(page) {
  const inner = page.querySelector('.page-inner');
  let changed = false;
  let guard = 0;
  while (SimpleDoc.Pagination.isOverflow(page) && guard++ < 80) {
    const last = inner.lastElementChild;
    if (!last) break;
    const next = SimpleDoc.Pagination.ensureNextPage(page);
    const nextInner = next.querySelector('.page-inner');

    if (last.matches('.editor-table-wrap') && SimpleDoc.Pagination.splitTable(page, last, nextInner)) {
      changed = true;
      continue;
    }
    if (last.matches('.doc-section') && SimpleDoc.Pagination.splitSection(page, last, nextInner)) {
      changed = true;
      continue;
    }
    if (inner.children.length === 1) {
      if (SimpleDoc.Pagination.splitTextBlock(page, last, nextInner)) {
        changed = true;
        continue;
      }
      break;
    }
    SimpleDoc.Pagination.prependNode(nextInner, last);
    changed = true;
  }
  SimpleDoc.warnOverflow(page);
  return changed;
};

SimpleDoc.Pagination.pullBack = function(page) {
  let changed = false;
  let guard = 0;
  while (guard++ < 80) {
    const next = SimpleDoc.Pagination.nextPage(page);
    if (!next || next.dataset.autoPage !== '1') break;
    const inner = page.querySelector('.page-inner');
    const nextInner = next.querySelector('.page-inner');
    SimpleDoc.Pagination.clearPlaceholder(nextInner);
    const first = nextInner.firstElementChild;
    if (!first) {
      if (SimpleDoc.getPages().length > 1) next.remove();
      changed = true;
      continue;
    }
    inner.appendChild(first);
    if (SimpleDoc.Pagination.isOverflow(page)) {
      nextInner.insertBefore(first, nextInner.firstChild);
      break;
    }
    changed = true;
    if (SimpleDoc.Pagination.isEmpty(nextInner) && SimpleDoc.getPages().length > 1) next.remove();
  }
  SimpleDoc.warnOverflow(page);
  return changed;
};

SimpleDoc.Pagination.paginateFrom = function(page) {
  if (SimpleDoc.Pagination.lock || !SimpleDoc.state.autoPaginate) return false;
  SimpleDoc.Pagination.lock = true;
  let changed = false;
  try {
    let pages = SimpleDoc.getPages();
    let start = Math.max(0, pages.indexOf(page));
    for (let i = start; i < SimpleDoc.getPages().length; i++) {
      const p = SimpleDoc.getPages()[i];
      changed = SimpleDoc.Pagination.flowOverflow(p) || changed;
    }
    pages = SimpleDoc.getPages();
    for (let i = start; i < pages.length - 1; i++) {
      changed = SimpleDoc.Pagination.pullBack(pages[i]) || changed;
      pages = SimpleDoc.getPages();
    }
    SimpleDoc.getPages().forEach(SimpleDoc.warnOverflow);
    SimpleDoc.refreshPageList();
    SimpleDoc.updatePageStatus();
  } finally {
    SimpleDoc.Pagination.lock = false;
  }
  if (changed) {
    SimpleDoc.markDirty();
    SimpleDoc.queueHistory();
  }
  return changed;
};

SimpleDoc.Pagination.paginateAll = function() {
  if (!SimpleDoc.state.autoPaginate) {
    SimpleDoc.getPages().forEach(SimpleDoc.warnOverflow);
    return false;
  }
  return SimpleDoc.Pagination.paginateFrom(SimpleDoc.getPages()[0]);
};

SimpleDoc.Pagination.queue = function(page, delay = 160) {
  clearTimeout(SimpleDoc.Pagination.timer);
  SimpleDoc.Pagination.timer = setTimeout(() => {
    if (page?.isConnected) SimpleDoc.Pagination.paginateFrom(page);
  }, delay);
};

window.SimpleDoc = window.SimpleDoc || {};
SimpleDoc.Storage = {};

SimpleDoc.Storage.getDocumentData = function() {
  return {
    app: 'SimpleDoc',
    version: '2.0',
    title: document.getElementById('docTitle').value.trim() || '새 문서',
    savedAt: new Date().toISOString(),
    settings: { autoPaginate: !!SimpleDoc.state.autoPaginate },
    pages: SimpleDoc.serializeContent()
  };
};

SimpleDoc.Storage.download = function() {
  const data = SimpleDoc.Storage.getDocumentData();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
  const a = document.createElement('a');
  const safe = data.title.replace(/[\\/:*?"<>|]/g, '_');
  a.href = URL.createObjectURL(blob);
  a.download = `${safe || 'document'}.ykdoc`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  localStorage.setItem('simpledoc-autosave', JSON.stringify(data));
  SimpleDoc.markSaved();
};

SimpleDoc.Storage.restorePages = function(pages) {
  const root = document.getElementById('documentRoot');
  root.innerHTML = '';
  pages.forEach(item => {
    const data = typeof item === 'string' ? { html: item, auto: false } : item;
    SimpleDoc.createPage(data.html || '<p class="doc-body"><br></p>', false, { auto: !!data.auto });
  });
  if (!SimpleDoc.getPages().length) SimpleDoc.createPage('<p class="doc-body"><br></p>', false);
};

SimpleDoc.Storage.loadFile = async function(file) {
  const text = await file.text();
  if (file.name.toLowerCase().endsWith('.html') || file.name.toLowerCase().endsWith('.htm')) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, 'text/html');
    const imported = doc.querySelector('main.document, .document, body');
    const root = document.getElementById('documentRoot');
    root.innerHTML = '';
    SimpleDoc.createPage(imported ? imported.innerHTML : text, false);
    document.getElementById('docTitle').value = file.name.replace(/\.[^.]+$/, '');
  } else {
    const data = JSON.parse(text);
    if (!Array.isArray(data.pages)) throw new Error('지원하지 않는 문서 형식입니다.');
    SimpleDoc.Storage.restorePages(data.pages);
    document.getElementById('docTitle').value = data.title || file.name.replace(/\.[^.]+$/, '');
    if (typeof data.settings?.autoPaginate === 'boolean') SimpleDoc.state.autoPaginate = data.settings.autoPaginate;
  }
  SimpleDoc.setActivePage(SimpleDoc.getPages()[0]);
  const toggle = document.getElementById('autoPaginateToggle');
  if (toggle) toggle.checked = SimpleDoc.state.autoPaginate;
  SimpleDoc.state.undoStack = [];
  SimpleDoc.state.redoStack = [];
  if (SimpleDoc.state.autoPaginate && SimpleDoc.Pagination) SimpleDoc.Pagination.paginateAll();
  SimpleDoc.snapshot();
  SimpleDoc.markSaved();
};

SimpleDoc.Storage.restoreAutosave = function() {
  const raw = localStorage.getItem('simpledoc-autosave');
  if (!raw) return false;
  try {
    const data = JSON.parse(raw);
    if (!Array.isArray(data.pages) || !data.pages.length) return false;
    SimpleDoc.Storage.restorePages(data.pages);
    document.getElementById('docTitle').value = data.title || '자동저장 문서';
    if (typeof data.settings?.autoPaginate === 'boolean') SimpleDoc.state.autoPaginate = data.settings.autoPaginate;
    SimpleDoc.setActivePage(SimpleDoc.getPages()[0]);
    const toggle = document.getElementById('autoPaginateToggle');
    if (toggle) toggle.checked = SimpleDoc.state.autoPaginate;
    SimpleDoc.snapshot();
    SimpleDoc.markSaved();
    return true;
  } catch { return false; }
};

  <script>
window.SimpleDoc = window.SimpleDoc || {};
SimpleDoc.Docx = {};
SimpleDoc.Docx.libraryPromise = null;

SimpleDoc.Docx.ensureLibrary = function() {
  if (window.domDocx?.convertHtmlToDocx) return Promise.resolve(window.domDocx);
  if (SimpleDoc.Docx.libraryPromise) return SimpleDoc.Docx.libraryPromise;
  SimpleDoc.Docx.libraryPromise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/dom-docx@1.0.3/dist/browser/dom-docx.browser.js';
    script.async = true;
    const timer = setTimeout(() => reject(new Error('DOCX 변환 모듈 연결 시간이 초과되었습니다.')), 15000);
    script.onload = () => {
      clearTimeout(timer);
      if (window.domDocx?.convertHtmlToDocx) resolve(window.domDocx);
      else reject(new Error('DOCX 변환 모듈 초기화에 실패했습니다.'));
    };
    script.onerror = () => { clearTimeout(timer); reject(new Error('DOCX 변환 모듈을 불러오지 못했습니다.')); };
    document.head.appendChild(script);
  }).catch(err => { SimpleDoc.Docx.libraryPromise = null; throw err; });
  return SimpleDoc.Docx.libraryPromise;
};

SimpleDoc.Docx.flattenVerticalMerges = function(root) {
  root.querySelectorAll('table').forEach(table => {
    const cells = [...table.querySelectorAll('td[rowspan],th[rowspan]')];
    cells.forEach(cell => {
      const span = parseInt(cell.getAttribute('rowspan') || '1', 10);
      if (span <= 1) return;
      const row = cell.parentElement;
      const rowIndex = [...table.rows].indexOf(row);
      const grid = SimpleDoc.Table?.grid(table);
      let logicalCol = 0;
      if (grid) {
        outer: for (let r = 0; r < grid.length; r++) for (let c = 0; c < (grid[r]?.length || 0); c++) {
          if (grid[r][c]?.cell === cell) { logicalCol = c; break outer; }
        }
      }
      cell.removeAttribute('rowspan');
      for (let i = 1; i < span; i++) {
        const targetRow = table.rows[rowIndex + i];
        if (!targetRow) continue;
        const blank = document.createElement(cell.tagName.toLowerCase());
        blank.innerHTML = '&nbsp;';
        const before = targetRow.cells[Math.min(logicalCol, targetRow.cells.length)] || null;
        targetRow.insertBefore(blank, before);
      }
    });
  });
};

SimpleDoc.Docx.createExportRoot = function() {
  const root = document.createElement('div');
  root.className = 'docx-export-root page-inner';
  Object.assign(root.style, {
    position: 'fixed', left: '-10000px', top: '0', width: '180mm', height: 'auto',
    inset: 'auto', overflow: 'visible', background: '#fff', visibility: 'hidden', zIndex: '-1'
  });
  const pages = SimpleDoc.getPages();
  pages.forEach((page, i) => {
    const pageContent = document.createElement('div');
    pageContent.className = 'docx-export-page';
    pageContent.innerHTML = page.querySelector('.page-inner').innerHTML;
    pageContent.querySelectorAll('.table-selected-cell,.selected').forEach(el => el.classList.remove('table-selected-cell','selected'));
    root.appendChild(pageContent);
    if (i < pages.length - 1) {
      const br = document.createElement('div');
      br.style.breakAfter = 'page';
      br.style.pageBreakAfter = 'always';
      br.style.height = '0';
      root.appendChild(br);
    }
  });
  document.body.appendChild(root);
  return root;
};

SimpleDoc.Docx.download = async function() {
  if (SimpleDoc.state.autoPaginate && SimpleDoc.Pagination) SimpleDoc.Pagination.paginateAll();
  const btn = document.getElementById('docxBtn');
  const old = btn?.textContent;
  if (btn) { btn.disabled = true; btn.textContent = 'DOCX 생성 중…'; }
  let exportRoot;
  const liveHasVerticalMerge = !!document.querySelector('.editor-table [rowspan]:not([rowspan="1"])');
  if (liveHasVerticalMerge) {
    const ok = confirm('세로 방향으로 병합된 셀이 있습니다. PDF에서는 그대로 유지되지만 현재 DOCX 내보내기에서는 Word 호환성을 위해 해당 세로 병합이 일반 셀로 풀립니다. DOCX 내보내기를 계속할까요?');
    if (!ok) { if (btn) { btn.disabled = false; btn.textContent = old || 'DOCX'; } return; }
  }
  try {
    await SimpleDoc.Docx.ensureLibrary();
    exportRoot = SimpleDoc.Docx.createExportRoot();
    const hasVerticalMerge = !!exportRoot.querySelector('[rowspan]:not([rowspan="1"])');
    if (hasVerticalMerge) SimpleDoc.Docx.flattenVerticalMerges(exportRoot);
    exportRoot.style.visibility = 'visible';
    exportRoot.style.opacity = '0.001';

    const title = document.getElementById('docTitle').value.trim() || '새 문서';
    const blob = await window.domDocx.convertHtmlToDocx(exportRoot.innerHTML, {
      styleSource: 'computed',
      root: exportRoot,
      pageSize: 'a4',
      orientation: 'portrait',
      margins: { top: 0.551, right: 0.591, bottom: 0.551, left: 0.591 },
      defaultFont: { family: 'Malgun Gothic', sizePt: 11 },
      metadata: { title, creator: 'SimpleDoc' },
      lang: 'ko-KR',
      onWarning: warning => console.warn('[SimpleDoc DOCX]', warning)
    });

    const safe = title.replace(/[\\/:*?"<>|]/g, '_') || 'document';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${safe}.docx`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    if (hasVerticalMerge) {
      console.info('SimpleDoc: 세로 병합 셀은 DOCX 호환성을 위해 내보내기 사본에서 일반 셀로 변환했습니다. HTML/PDF 원본은 변경되지 않았습니다.');
    }
  } catch (err) {
    console.error(err);
    alert(`DOCX 내보내기 실패: ${err.message}`);
  } finally {
    exportRoot?.remove();
    if (btn) { btn.disabled = false; btn.textContent = old || 'DOCX'; }
  }
};

  </script>
  <script>
window.SimpleDoc = window.SimpleDoc || {};
SimpleDoc.Print = {};

SimpleDoc.Print.run = function() {
  if (SimpleDoc.state.autoPaginate && SimpleDoc.Pagination) SimpleDoc.Pagination.paginateAll();
  SimpleDoc.getPages().forEach(SimpleDoc.warnOverflow);
  const overflow = document.querySelector('.a4-page.overflowing');
  if (overflow) {
    const ok = confirm('일부 페이지 내용이 A4 인쇄 영역을 초과했습니다. 초과된 내용은 잘릴 수 있습니다. 그대로 PDF 출력을 진행할까요?');
    if (!ok) return;
  }
  window.print();
};

  </script>
  <script>
document.addEventListener('DOMContentLoaded', () => {
  const root = document.getElementById('documentRoot');

  function resetDocument() {
    if (SimpleDoc.state.dirty && !confirm('현재 문서를 비우고 새 문서를 만들까요? 저장하지 않은 변경사항은 사라집니다.')) return;
    root.innerHTML = '';
    document.getElementById('docTitle').value = '새 문서';
    SimpleDoc.state.activePageId = null;
    SimpleDoc.createPage(SimpleDoc.defaultPageHTML(), true);
    SimpleDoc.state.undoStack = [];
    SimpleDoc.state.redoStack = [];
    SimpleDoc.snapshot();
    SimpleDoc.markDirty();
  }

  SimpleDoc.createPage(SimpleDoc.defaultPageHTML(), false);
  SimpleDoc.snapshot();
  SimpleDoc.Table.bind();
  SimpleDoc.Image.bind();

  document.getElementById('newDocBtn').addEventListener('click', resetDocument);
  const addManualPage = () => {
    const active = SimpleDoc.getActivePage();
    SimpleDoc.createPage('<p class="doc-body"><br></p>', true, { auto: false, after: active });
    SimpleDoc.markDirty();
    SimpleDoc.snapshot();
  };
  document.getElementById('addPageBtn').addEventListener('click', addManualPage);
  document.getElementById('floatingAddPage').addEventListener('click', addManualPage);
  document.getElementById('deletePageBtn').addEventListener('click', SimpleDoc.deleteActivePage);
  document.getElementById('saveBtn').addEventListener('click', SimpleDoc.Storage.download);
  document.getElementById('printBtn').addEventListener('click', SimpleDoc.Print.run);
  document.getElementById('docxBtn').addEventListener('click', SimpleDoc.Docx.download);

  document.getElementById('loadFileInput').addEventListener('change', async e => {
    const file = e.target.files?.[0];
    if (!file) return;
    try { await SimpleDoc.Storage.loadFile(file); }
    catch (err) { alert(`불러오기 실패: ${err.message}`); }
    e.target.value = '';
  });

  document.getElementById('fontFamily').addEventListener('change', e => SimpleDoc.Selection.wrapSelection({ fontFamily: e.target.value }));
  document.getElementById('fontSize').addEventListener('change', e => SimpleDoc.Selection.wrapSelection({ fontSize: `${e.target.value}pt` }));
  document.getElementById('textColor').addEventListener('change', e => SimpleDoc.Selection.wrapSelection({ color: e.target.value }));
  document.getElementById('boldBtn').addEventListener('click', () => SimpleDoc.Selection.toggleStyle('fontWeight', '700', '400'));
  document.getElementById('italicBtn').addEventListener('click', () => SimpleDoc.Selection.toggleStyle('fontStyle', 'italic', 'normal'));
  document.getElementById('underlineBtn').addEventListener('click', () => SimpleDoc.Selection.toggleStyle('textDecorationLine', 'underline', 'none'));
  document.querySelectorAll('[data-align]').forEach(btn => btn.addEventListener('click', () => SimpleDoc.Selection.align(btn.dataset.align)));

  document.getElementById('lineHeight').addEventListener('change', e => SimpleDoc.Selection.applyBlockStyles({ lineHeight: e.target.value }));
  document.getElementById('paragraphSpacing').addEventListener('change', e => SimpleDoc.Selection.applyBlockStyles({ marginBottom: `${e.target.value}pt` }));

  document.querySelectorAll('[data-block]').forEach(btn => btn.addEventListener('click', () => SimpleDoc.insertBlock(btn.dataset.block)));
  document.getElementById('insertCheckboxBtn').addEventListener('click', () => SimpleDoc.insertHTML('<label class="doc-checkbox"><input type="checkbox"> <span>체크 항목</span></label>&nbsp;'));
  document.getElementById('insertTextboxBtn').addEventListener('click', SimpleDoc.Textbox.insert);
  document.getElementById('insertDividerBtn').addEventListener('click', () => SimpleDoc.insertHTML('<div class="doc-divider"></div><p class="doc-body"><br></p>'));

  const imageInput = document.getElementById('imageFileInput');
  document.getElementById('insertImageBtn').addEventListener('click', () => {
    SimpleDoc.Selection.capture();
    imageInput.click();
  });
  imageInput.addEventListener('change', e => {
    const file = e.target.files?.[0];
    if (file) SimpleDoc.Image.insertFile(file);
    e.target.value = '';
  });
  document.getElementById('imageWidth').addEventListener('change', e => SimpleDoc.Image.setWidth(e.target.value));
  document.getElementById('deleteImageBtn').addEventListener('click', SimpleDoc.Image.remove);

  const tableDialog = document.getElementById('tableDialog');
  document.getElementById('insertTableBtn').addEventListener('click', () => { SimpleDoc.Selection.capture(); tableDialog.showModal(); });
  document.getElementById('cancelTableBtn').addEventListener('click', () => tableDialog.close());
  document.getElementById('tableForm').addEventListener('submit', e => {
    e.preventDefault();
    const rows = Math.max(1, Math.min(30, parseInt(document.getElementById('tableRows').value || '1', 10)));
    const cols = Math.max(1, Math.min(12, parseInt(document.getElementById('tableCols').value || '1', 10)));
    const header = document.getElementById('headerRow').checked;
    tableDialog.close();
    setTimeout(() => SimpleDoc.insertHTML(SimpleDoc.Table.build(rows, cols, header)), 0);
  });

  document.getElementById('rowAboveBtn').addEventListener('click', () => SimpleDoc.Table.addRow('above'));
  document.getElementById('rowBelowBtn').addEventListener('click', () => SimpleDoc.Table.addRow('below'));
  document.getElementById('deleteRowBtn').addEventListener('click', SimpleDoc.Table.deleteRow);
  document.getElementById('colLeftBtn').addEventListener('click', () => SimpleDoc.Table.addColumn('left'));
  document.getElementById('colRightBtn').addEventListener('click', () => SimpleDoc.Table.addColumn('right'));
  document.getElementById('deleteColBtn').addEventListener('click', SimpleDoc.Table.deleteColumn);
  document.getElementById('mergeCellsBtn').addEventListener('click', SimpleDoc.Table.mergeSelected);
  document.getElementById('splitCellBtn').addEventListener('click', SimpleDoc.Table.splitCell);

  const autoToggle = document.getElementById('autoPaginateToggle');
  autoToggle.checked = SimpleDoc.state.autoPaginate;
  autoToggle.addEventListener('change', () => {
    SimpleDoc.state.autoPaginate = autoToggle.checked;
    if (SimpleDoc.state.autoPaginate) SimpleDoc.Pagination.paginateAll();
    else SimpleDoc.getPages().forEach(SimpleDoc.warnOverflow);
    SimpleDoc.markDirty();
  });

  document.getElementById('undoBtn').addEventListener('click', SimpleDoc.undo);
  document.getElementById('redoBtn').addEventListener('click', SimpleDoc.redo);

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault(); SimpleDoc.Storage.download();
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
      e.preventDefault(); SimpleDoc.undo();
    }
    if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) {
      e.preventDefault(); SimpleDoc.redo();
    }
  });

  const zoom = document.getElementById('zoomRange');
  function applyZoom() {
    const z = Number(zoom.value) / 100;
    document.getElementById('documentRoot').style.setProperty('--zoom', z);
    document.querySelectorAll('.a4-page').forEach(p => p.style.setProperty('--zoom', z));
    document.getElementById('zoomValue').textContent = `${zoom.value}%`;
  }
  zoom.addEventListener('input', applyZoom);
  applyZoom();

  document.getElementById('docTitle').addEventListener('input', SimpleDoc.markDirty);

  window.addEventListener('beforeunload', e => {
    if (!SimpleDoc.state.dirty) return;
    e.preventDefault();
    e.returnValue = '';
  });
});

  </script>
